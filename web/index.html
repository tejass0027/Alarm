const DAY_LABELS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
const CHALLENGE_TYPES = [
  { value: 'random', label: 'Random' },
  { value: 'math', label: 'Math' },
  { value: 'typing', label: 'Typing' }
];
const TYPING_PHRASES = [
  'the early bird catches the worm',
  'discipline beats motivation',
  'get up and seize the day',
  'consistency is the real secret'
];

function generateChallenge(type) {
  const kind = type === 'random' ? (Math.random() < 0.5 ? 'math' : 'typing') : type;
  if (kind === 'typing') {
    const phrase = TYPING_PHRASES[Math.floor(Math.random() * TYPING_PHRASES.length)];
    return {
      prompt: `Type this exactly:\n"${phrase}"`,
      check: (answer) => answer.trim().toLowerCase() === phrase.toLowerCase()
    };
  }
  const ops = ['+', '-', '*'];
  const op = ops[Math.floor(Math.random() * ops.length)];
  let x = Math.floor(Math.random() * 40) + 1;
  let y = Math.floor(Math.random() * 40) + 1;
  if (op === '-' && y > x) {
    [x, y] = [y, x];
  }
  const answer = op === '+' ? x + y : op === '-' ? x - y : x * y;
  return {
    prompt: `What is ${x} ${op} ${y} ?`,
    check: (input) => Number(input.trim()) === answer
  };
}

        </div>
        <button
          type="button"
          role="switch"

          aria-label={alarm.enabled ? 'Disable alarm' : 'Enable alarm'}
          onClick={() => onToggle(alarm.id)}

          }`}

      <div className="flex flex-wrap items-center gap-2 mt-4">

          ${alarm.stake} at stake

          aria-label="Delete alarm"

function AlarmModal({ existing, onClose, onSave }) {
  const [time, setTime] = useState(existing?.time ?? '07:00');
  const [label, setLabel] = useState(existing?.label ?? '');
  const [stake, setStake] = useState(existing ? String(existing.stake) : '5');
  const [days, setDays] = useState(existing?.days ?? []);
  const [challengeType, setChallengeType] = useState(existing?.challengeType ?? 'random');
  const [error, setError] = useState('');

  const toggleDay = (i) =>
    setDays((prev) => (prev.includes(i) ? prev.filter((d) => d !== i) : [...prev, i].sort()));

  const handleSubmit = (e) => {
    e.preventDefault();
    const stakeNumber = Number(stake);
    if (!time) {
      setError('Pick a time for the alarm.');
      return;
    }
    if (!stakeNumber || stakeNumber <= 0) {
      setError('Stake must be greater than $0.');
      return;
    }
    onSave({
      id: existing?.id ?? Date.now(),
      enabled: existing?.enabled ?? true,
      time,
      label: label.trim(),
      stake: stakeNumber,
      days,
      challengeType
    });
  };

  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4"
      onClick={onClose}
    >
      <div
        className="animate-modal-in w-full max-w-md rounded-2xl border border-edge bg-surface p-6"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-5">
          <h3 className="font-display text-lg font-semibold text-paper">
            {existing ? 'Edit alarm' : 'New alarm'}
          </h3>
          <button
            type="button"
            aria-label="Close"
            onClick={onClose}
            className="focus-ring w-8 h-8 rounded-lg flex items-center justify-center text-ink3 hover:text-paper hover:bg-surface2 transition-colors duration-200"
          >
            <X size={16} />
          </button>
        </div>

        <form onSubmit={handleSubmit} className="flex flex-col gap-4">
          <div className="flex gap-3">
            <label className="flex-1">
              <span className="block text-xs text-ink2 mb-1.5">Time</span>
              <input
                type="time"
                value={time}
                onChange={(e) => setTime(e.target.value)}
                style={{ colorScheme: 'dark' }}
                className="w-full rounded-lg bg-surface2 border border-edge px-3 py-2 text-sm text-paper focus:outline-none focus:border-accent transition-colors duration-200"
              />
            </label>
            <label className="flex-1">
              <span className="block text-xs text-ink2 mb-1.5">Stake</span>
              <div className="relative">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-ink3 text-sm">$</span>
                <input
                  type="number"
                  min="1"
                  step="1"
                  value={stake}
                  onChange={(e) => setStake(e.target.value)}
                  className="w-full rounded-lg bg-surface2 border border-edge pl-6 pr-3 py-2 text-sm text-paper focus:outline-none focus:border-accent transition-colors duration-200"
                />
              </div>
            </label>
          </div>

          <label>
            <span className="block text-xs text-ink2 mb-1.5">Label</span>
            <input
              type="text"
              value={label}
              onChange={(e) => setLabel(e.target.value)}
              placeholder="Gym before work"
              className="w-full rounded-lg bg-surface2 border border-edge px-3 py-2 text-sm text-paper placeholder:text-ink3/60 focus:outline-none focus:border-accent transition-colors duration-200"
            />
          </label>

          <div>
            <span className="block text-xs text-ink2 mb-1.5">Repeat on</span>
            <div className="flex items-center gap-1.5">
              {DAY_LABELS.map((d, i) => (
                <button
                  key={i}
                  type="button"
                  onClick={() => toggleDay(i)}
                  className={`focus-ring w-8 h-8 rounded-full text-xs font-medium transition-colors duration-200 ${
                    days.includes(i) ? 'bg-accent text-ink' : 'bg-surface2 text-ink3 hover:text-ink2'

            </div>
            <p className="text-ink3 text-[11px] mt-1.5">Leave all unselected for a one-time alarm.</p>
          </div>

          <div>
            <span className="block text-xs text-ink2 mb-1.5">Challenge</span>
            <div className="grid grid-cols-3 gap-1.5">
              {CHALLENGE_TYPES.map((c) => (
                <button
                  key={c.value}
                  type="button"
                  onClick={() => setChallengeType(c.value)}
                  className={`focus-ring rounded-lg py-1.5 text-xs font-medium transition-colors duration-200 border ${
                    challengeType === c.value
                      ? 'bg-accent/20 text-accent2 border-accent/40'
                      : 'bg-surface2 text-ink3 border-transparent hover:text-ink2'
                  }`}
                >
                  {c.label}
                </button>
              ))}
            </div>
          </div>

          {error && <p className="text-stake text-xs">{error}</p>}

          <div className="flex items-center gap-2 mt-2">
            <button
              type="submit"
              className="focus-ring flex-1 rounded-full bg-accent text-ink font-medium text-sm py-2.5 hover:bg-accent2 hover:scale-105 transition-all duration-200"
            >
              Save alarm
            </button>
            <button
              type="button"
              onClick={onClose}
              className="focus-ring rounded-full border border-edge text-ink2 font-medium text-sm px-5 py-2.5 hover:text-paper hover:border-ink3 transition-colors duration-200"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

function RingingScreen({ alarm, onResolve }) {
  const rounds = 2;
  const [round, setRound] = useState(1);
  const [challenge, setChallenge] = useState(() => generateChallenge(alarm.challengeType));
  const [answer, setAnswer] = useState('');
  const [feedback, setFeedback] = useState(null);
  const [confirmingGiveUp, setConfirmingGiveUp] = useState(false);

  const handleChange = (e) => {
    setAnswer(e.target.value);
    setFeedback(null);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!answer.trim()) {
      setFeedback({ type: 'error', text: 'Enter an answer first.' });
      return;
    }
    if (challenge.check(answer)) {
      if (round >= rounds) {
        onResolve('solved');
        return;
      }
      setFeedback({ type: 'success', text: 'Correct — next one.' });
      setRound((r) => r + 1);
      setChallenge(generateChallenge(alarm.challengeType));
      setAnswer('');
    } else {
      setFeedback({ type: 'error', text: 'Not quite — try again.' });
      setAnswer('');
    }
  };

  return (
    <div className="min-h-screen bg-ink font-body text-paper flex items-center justify-center p-6 relative overflow-hidden">
      <div
        className="absolute top-1/4 left-1/2 -translate-x-1/2 w-72 h-72 rounded-full bg-stake/20 blur-[100px]"
        aria-hidden="true"
      ></div>
      <div className="relative w-full max-w-sm text-center">
        <div className="mx-auto w-16 h-16 rounded-full bg-stake/15 border border-stake/40 flex items-center justify-center text-stake animate-pulse">
          <Bell size={26} strokeWidth={1.8} />
        </div>
        <h1 className="font-display text-3xl font-semibold mt-6">Wake up</h1>
        <p className="text-ink2 text-sm mt-2">{alarm.label || 'Alarm'}</p>

        <div className="inline-flex items-center gap-1.5 rounded-full bg-stake/10 text-stake border border-stake/25 px-4 py-1.5 text-sm font-medium mt-4">
          <AlertTriangle size={14} />${alarm.stake} at stake
        </div>

        <p className="text-ink3 text-xs mt-8 uppercase tracking-wide">
          Round {round} of {rounds}
        </p>
        <p className="font-display text-xl mt-3 whitespace-pre-line">{challenge.prompt}</p>

        <form onSubmit={handleSubmit} className="mt-5">
          <input
            type="text"
            value={answer}
            onChange={handleChange}
            autoFocus
            className="w-full rounded-lg bg-surface2 border border-edge px-4 py-2.5 text-center text-paper focus:outline-none focus:border-accent transition-colors duration-200"
            placeholder="Your answer"
          />
          {feedback && (
            <p className={`text-xs mt-2 ${feedback.type === 'success' ? 'text-win' : 'text-stake'}`}>
              {feedback.text}
            </p>
          )}
          <button
            type="submit"
            className="focus-ring w-full rounded-full bg-accent text-ink font-medium text-sm py-2.5 mt-4 hover:bg-accent2 hover:scale-105 transition-all duration-200"
          >
            Submit
          </button>
        </form>

        <div className="mt-6">
          {confirmingGiveUp ? (
            <div className="flex items-center justify-center gap-3">
              <button
                type="button"
                onClick={() => onResolve('gave_up')}
                className="focus-ring rounded-full bg-stake text-ink text-xs font-medium px-4 py-2 hover:scale-105 transition-all duration-200"
              >
                Confirm — lose ${alarm.stake}
              </button>
              <button
                type="button"
                onClick={() => setConfirmingGiveUp(false)}
                className="focus-ring text-ink3 text-xs hover:text-ink2 transition-colors duration-200"
              >
                Cancel
              </button>
            </div>
          ) : (
            <button
              type="button"
              onClick={() => setConfirmingGiveUp(true)}
              className="focus-ring text-stake/80 text-xs hover:text-stake transition-colors duration-200"
            >
              Give up (lose stake)
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [balance, setBalance] = useState(482.5);
  const [alarms, setAlarms] = useState([
    { id: 1, time: '06:30', label: 'Gym before work', stake: 15, days: [0, 1, 2, 3, 4], enabled: true },
    { id: 2, time: '08:00', label: 'Sunday long run', stake: 10, days: [6], enabled: true },
    { id: 3, time: '05:45', label: 'Flight to Denver', stake: 25, days: [], enabled: false }
  ]);

  const toggleAlarm = (id) =>
    setAlarms((prev) => prev.map((a) => (a.id === id ? { ...a, enabled: !a.enabled } : a)));

  const deleteAlarm = (id) => setAlarms((prev) => prev.filter((a) => a.id !== id));

  const [modalOpen, setModalOpen] = useState(false);
  const [editingAlarm, setEditingAlarm] = useState(null);

  const openAddModal = () => {
    setEditingAlarm(null);
    setModalOpen(true);
  };
  const openEditModal = (alarm) => {
    setEditingAlarm(alarm);
    setModalOpen(true);
  };
  const closeModal = () => setModalOpen(false);
  const saveAlarm = (alarm) => {
    setAlarms((prev) => {
      const exists = prev.some((a) => a.id === alarm.id);
      return exists ? prev.map((a) => (a.id === alarm.id ? alarm : a)) : [...prev, alarm];
    });
    setModalOpen(false);
  };

  const activeCount = alarms.filter((a) => a.enabled).length;
  const totalStaked = alarms.filter((a) => a.enabled).reduce((sum, a) => sum + a.stake, 0);

  const stats = [
    { label: 'Active alarms', value: String(activeCount), Icon: Clock },
    { label: 'Total staked', value: `$${totalStaked}`, Icon: Wallet },
    { label: 'Win rate', value: '86%', Icon: TrendingUp }
  ];

  const [ringingAlarm, setRingingAlarm] = useState(null);
  const resolveRing = (result) => {
    if (result === 'gave_up' && ringingAlarm) {
      setBalance((b) => b - ringingAlarm.stake);
    }
    setRingingAlarm(null);
  };

  if (ringingAlarm) {
    return <RingingScreen alarm={ringingAlarm} onResolve={resolveRing} />;
  }

  return (
    <div className="min-h-screen bg-ink font-body text-paper">
      <header className="sticky top-0 z-30 backdrop-blur-xl bg-ink/70 border-b border-edge">
        <div className="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-xl bg-accent/15 border border-accent/30 flex items-center justify-center text-accent">
              <Bell size={16} strokeWidth={2} />
            </div>
            <span className="font-display font-semibold tracking-tight text-[15px]">Stake Alarm</span>
          </div>
          <div className="flex items-center gap-3">
            <div className="hidden sm:flex items-center gap-2 rounded-full border border-edge bg-surface px-3.5 py-1.5">
              <span className="text-ink3 text-xs">Balance</span>
              <span className="tabular font-semibold text-sm text-paper">${balance.toFixed(2)}</span>
            </div>
            <button
              type="button"
              aria-label="Settings"
              className="focus-ring w-9 h-9 rounded-full border border-edge flex items-center justify-center text-ink2 hover:text-paper hover:border-ink3 transition-colors duration-200"
            >
              <Settings size={17} />
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-6 py-10">
        <div className="grid md:grid-cols-[1.3fr_1fr] gap-5">
          <div className="relative rounded-2xl border border-accent/25 bg-gradient-to-br from-surface via-surface to-surface2 p-7 overflow-hidden">
            <div
              className="absolute -top-24 -right-16 w-56 h-56 rounded-full bg-accent/20 blur-[90px]"
              aria-hidden="true"
            ></div>
            <p className="relative text-ink2 text-sm mb-3">Available to stake</p>
            <p className="relative font-display tabular text-5xl sm:text-6xl font-semibold text-paper">
              ${balance.toFixed(2)}
            </p>
            <div className="relative flex flex-wrap items-center gap-3 mt-6">
              <button
                type="button"
                onClick={() => setBalance((b) => b + 50)}
                className="focus-ring rounded-full bg-accent text-ink font-medium text-sm px-5 py-2.5 hover:bg-accent2 hover:scale-105 transition-all duration-200"
              >
                Deposit funds
              </button>
              <span className="text-ink3 text-xs">Virtual balance — no real money moves</span>
            </div>
          </div>

          <div className="grid grid-cols-3 md:grid-cols-1 gap-3">
            {stats.map(({ label, value, Icon: StatIcon }) => (
              <div
                key={label}
                className="rounded-2xl border border-edge bg-surface px-4 py-3.5 flex flex-col md:flex-row items-start md:items-center gap-1.5 md:gap-3 hover:border-ink3 transition-colors duration-200"
              >
                <div className="w-8 h-8 rounded-lg bg-surface2 flex items-center justify-center text-accent2 shrink-0">
                  <StatIcon size={16} />
                </div>
                <div className="flex flex-row md:flex-col items-baseline md:items-start gap-1.5 md:gap-0">
                  <p className="font-display tabular text-lg font-semibold text-paper">{value}</p>
                  <p className="text-ink3 text-[11px] leading-none">{label}</p>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="mt-10">
          <div className="flex items-center justify-between">
            <h2 className="font-display text-sm tracking-wide text-ink2 uppercase">Your alarms</h2>
            <button
              type="button"
              onClick={openAddModal}
              className="focus-ring flex items-center gap-1.5 rounded-full bg-accent/15 border border-accent/30 text-accent2 text-xs font-medium px-3.5 py-1.5 hover:bg-accent/25 hover:scale-105 transition-all duration-200"
            >
              <Plus size={13} strokeWidth={2.2} />
              Add alarm
            </button>
          </div>
          {alarms.length === 0 ? (
            <p className="text-ink3 text-sm mt-4">No alarms yet — add your first one.</p>
          ) : (
            <div className="grid sm:grid-cols-2 gap-4 mt-4">
              {alarms.map((alarm, i) => (
                <AlarmCard
                  key={alarm.id}
                  alarm={alarm}
                  style={{ animationDelay: `${i * 60}ms` }}
                  onToggle={toggleAlarm}
                  onDelete={deleteAlarm}
                  onEdit={() => openEditModal(alarm)}
                  onRing={() => setRingingAlarm(alarm)}
                />
              ))}
            </div>
          )}
        </div>
      </main>

      {modalOpen && <AlarmModal existing={editingAlarm} onClose={closeModal} onSave={saveAlarm} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
