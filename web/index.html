/*

  );
}

/* The core visual signature: every number on the board renders as individual
   mechanical flap characters, like a real split-flap departure display. */
function FlapChar({ char, size = 'md', dim = false }) {
  if (char === ' ') return <span className="inline-block w-2" aria-hidden="true" />;
  if (!/[A-Za-z0-9]/.test(char)) {
    const punctSize = size === 'lg' ? 'text-3xl px-0.5' : size === 'sm' ? 'text-sm px-0.5' : 'text-lg px-0.5';
    return <span className={`font-display font-black text-amber/60 ${punctSize}`}>{char}</span>;
  }
  const sizing =
    size === 'lg'
      ? 'text-3xl w-10 h-12'
      : size === 'sm'
      ? 'text-sm w-5 h-6'
      : 'text-lg w-7 h-9';
  return (
    <span
      className={`relative inline-flex items-center justify-center rounded-[3px] bg-tile font-display font-black leading-none ${sizing} ${
        dim ? 'text-amberDim' : 'text-amber'
      }`}
      style={{ boxShadow: 'inset 0 -3px 0 rgba(0,0,0,0.45), inset 0 2px 0 rgba(255,255,255,0.04)' }}
    >
      {char}
      <span className="absolute left-0 right-0 top-1/2 h-px bg-seam/80 -translate-y-px pointer-events-none" />
    </span>
  );
}

function FlapRow({ text, size = 'md', dim = false }) {
  return (
    <span className="inline-flex items-center gap-[3px]" aria-label={text}>
      {text.split('').map((c, i) => (
        <FlapChar key={i} char={c} size={size} dim={dim} />
      ))}
    </span>
  );
}

const DAY_LABELS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
const CHALLENGE_TYPES = [
  { value: 'random', label: 'Random' },
  { value: 'math', label: 'Math' },
  { value: 'typing', label: 'Typing' }
];
const TYPING_PHRASES = [
  'the early bird catches the worm',
  'discipline beats motivation',
  'get up and seize the day',
  'consistency is the real secret'
];

function generateChallenge(type) {
  const kind = type === 'random' ? (Math.random() < 0.5 ? 'math' : 'typing') : type;
  if (kind === 'typing') {
    const phrase = TYPING_PHRASES[Math.floor(Math.random() * TYPING_PHRASES.length)];
    return {
      prompt: `Type this exactly:\n"${phrase}"`,
      check: (answer) => answer.trim().toLowerCase() === phrase.toLowerCase()
    };
  }
  const ops = ['+', '-', '*'];
  const op = ops[Math.floor(Math.random() * ops.length)];
  let x = Math.floor(Math.random() * 40) + 1;
  let y = Math.floor(Math.random() * 40) + 1;
  if (op === '-' && y > x) {
    [x, y] = [y, x];
  }
  const answer = op === '+' ? x + y : op === '-' ? x - y : x * y;
  return {
    prompt: `What is ${x} ${op} ${y} ?`,
    check: (input) => Number(input.trim()) === answer
  };
}

function AlarmRow({ alarm, onToggle, onDelete, onEdit, onRing, style }) {
  const hasRepeat = alarm.days.length > 0;
  return (
    <div
      style={style}
      className={`animate-fade-in-up flex flex-col sm:flex-row sm:items-center gap-4 border-b border-tile py-5 transition-opacity duration-200 ${
        alarm.enabled ? '' : 'opacity-50'
      }`}
    >
      <div className="shrink-0">
        <FlapRow text={alarm.time} size="lg" dim={!alarm.enabled} />
      </div>

      <div className="flex-1 min-w-0">
        <p className="font-mono text-sm text-ink2 uppercase tracking-wide truncate">
          {alarm.label || 'Unlabeled'}
        </p>
        <div className="flex items-center gap-1.5 mt-2">
          {hasRepeat ? (
            DAY_LABELS.map((d, i) => (
              <span
                key={i}
                className={`w-4 h-4 rounded-sm flex items-center justify-center text-[9px] font-mono font-bold ${
                  alarm.days.includes(i) ? 'bg-amber/20 text-amber' : 'bg-tile text-ink3'
                }`}
              >
                {d}
              </span>
            ))
          ) : (
            <span className="font-mono text-[10px] text-ink3 uppercase tracking-widest">One-time</span>
          )}
        </div>
      </div>

      <div className="flex items-center gap-6 shrink-0">
        <div className="text-right">
          <p className="font-mono text-[10px] text-ink3 uppercase tracking-widest mb-1">Stake</p>
          <FlapRow text={`$${alarm.stake}`} size="sm" />
        </div>

        <button
          type="button"
          role="switch"
          aria-checked={alarm.enabled}
          aria-label={alarm.enabled ? 'Disable alarm' : 'Enable alarm'}
          onClick={() => onToggle(alarm.id)}
          className={`focus-ring w-11 h-6 rounded-full border transition-colors duration-200 relative shrink-0 ${
            alarm.enabled ? 'bg-amber border-amber' : 'bg-tile border-seam'
          }`}
        >
          <span
            className={`absolute top-0.5 left-0.5 w-[18px] h-[18px] rounded-full bg-board transition-transform duration-200 ${
              alarm.enabled ? 'translate-x-[22px]' : 'translate-x-0'
            }`}
          />
        </button>

        <div className="flex items-center gap-1">
          <button
            type="button"
            aria-label="Preview ring"
            onClick={onRing}
            className="focus-ring w-8 h-8 rounded flex items-center justify-center text-ink3 hover:text-amber hover:bg-tile transition-colors duration-200"

            <Bell size={15} />
          </button>
          <button
            type="button"
            aria-label="Edit alarm"
            onClick={onEdit}
            className="focus-ring w-8 h-8 rounded flex items-center justify-center text-ink3 hover:text-amber hover:bg-tile transition-colors duration-200"
          >
            <Pencil size={15} />
          </button>
          <button
            type="button"
            aria-label="Delete alarm"
            onClick={() => onDelete(alarm.id)}
            className="focus-ring w-8 h-8 rounded flex items-center justify-center text-ink3 hover:text-risk hover:bg-tile transition-colors duration-200"
          >
            <Trash2 size={15} />
          </button>
        </div>
      </div>
    </div>
  );
}

function AlarmModal({ existing, onClose, onSave }) {
  const [time, setTime] = useState(existing?.time ?? '07:00');
  const [label, setLabel] = useState(existing?.label ?? '');
  const [stake, setStake] = useState(existing ? String(existing.stake) : '5');
  const [days, setDays] = useState(existing?.days ?? []);
  const [challengeType, setChallengeType] = useState(existing?.challengeType ?? 'random');
  const [error, setError] = useState('');

  const toggleDay = (i) =>
    setDays((prev) => (prev.includes(i) ? prev.filter((d) => d !== i) : [...prev, i].sort()));

  const handleSubmit = (e) => {
    e.preventDefault();
    const stakeNumber = Number(stake);
    if (!time) {
      setError('Pick a time for the alarm.');
      return;
    }
    if (!stakeNumber || stakeNumber <= 0) {
      setError('Stake must be greater than $0.');
      return;
    }
    onSave({
      id: existing?.id ?? Date.now(),
      enabled: existing?.enabled ?? true,
      time,
      label: label.trim(),
      stake: stakeNumber,
      days,
      challengeType
    });
  };

  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4"
      onClick={onClose}
    >
      <div
        className="animate-modal-in w-full max-w-md rounded-lg border-2 border-tile bg-board p-6"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-5 pb-4 border-b border-tile">
          <h3 className="font-display font-black text-base tracking-wide text-amber uppercase">
            {existing ? 'Edit entry' : 'New entry'}
          </h3>
          <button
            type="button"
            aria-label="Close"
            onClick={onClose}
            className="focus-ring w-8 h-8 rounded flex items-center justify-center text-ink3 hover:text-amber hover:bg-tile transition-colors duration-200"
          >
            <X size={16} />
          </button>
        </div>

        <form onSubmit={handleSubmit} className="flex flex-col gap-4 font-mono">
          <div className="flex gap-3">
            <label className="flex-1">
              <span className="block text-[10px] text-ink3 uppercase tracking-widest mb-1.5">Time</span>
              <input
                type="time"
                value={time}
                onChange={(e) => setTime(e.target.value)}
                style={{ colorScheme: 'dark' }}
                className="w-full rounded bg-tile border border-tile px-3 py-2 text-sm text-amber focus:outline-none focus:border-amber transition-colors duration-200"
              />
            </label>
            <label className="flex-1">
              <span className="block text-[10px] text-ink3 uppercase tracking-widest mb-1.5">Stake</span>
              <div className="relative">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-ink3 text-sm">$</span>
                <input
                  type="number"
                  min="1"
                  step="1"
                  value={stake}
                  onChange={(e) => setStake(e.target.value)}
                  className="w-full rounded bg-tile border border-tile pl-6 pr-3 py-2 text-sm text-risk focus:outline-none focus:border-amber transition-colors duration-200"
                />
              </div>
            </label>
          </div>

          <label>
            <span className="block text-[10px] text-ink3 uppercase tracking-widest mb-1.5">Label</span>
            <input
              type="text"
              value={label}
              onChange={(e) => setLabel(e.target.value)}
              placeholder="Gym before work"
              className="w-full rounded bg-tile border border-tile px-3 py-2 text-sm text-ink2 placeholder:text-ink3/60 focus:outline-none focus:border-amber transition-colors duration-200"
            />
          </label>

          <div>
            <span className="block text-[10px] text-ink3 uppercase tracking-widest mb-1.5">Repeat on</span>
            <div className="flex items-center gap-1.5">
              {DAY_LABELS.map((d, i) => (
                <button
                  key={i}
                  type="button"
                  onClick={() => toggleDay(i)}
                  className={`focus-ring w-8 h-8 rounded text-xs font-bold transition-colors duration-200 ${
                    days.includes(i) ? 'bg-amber text-board' : 'bg-tile text-ink3 hover:text-ink2'
                  }`}
                >
                  {d}
                </button>
              ))}
            </div>
            <p className="text-ink3 text-[11px] mt-1.5">Leave all unselected for a one-time alarm.</p>
          </div>

          <div>
            <span className="block text-[10px] text-ink3 uppercase tracking-widest mb-1.5">Challenge</span>
            <div className="grid grid-cols-3 gap-1.5">
              {CHALLENGE_TYPES.map((c) => (
                <button
                  key={c.value}
                  type="button"
                  onClick={() => setChallengeType(c.value)}
                  className={`focus-ring rounded py-1.5 text-xs font-semibold uppercase tracking-wide transition-colors duration-200 border ${
                    challengeType === c.value
                      ? 'bg-amber/20 text-amber border-amber/50'
                      : 'bg-tile text-ink3 border-transparent hover:text-ink2'
                  }`}
                >
                  {c.label}
                </button>
              ))}
            </div>
          </div>

          {error && <p className="text-risk text-xs">{error}</p>}

          <div className="flex items-center gap-2 mt-2">
            <button
              type="submit"
              className="focus-ring flex-1 rounded bg-amber text-board font-display font-black text-sm uppercase tracking-wide py-2.5 hover:bg-amber/90 hover:scale-105 transition-all duration-200"
            >
              Save alarm
            </button>
            <button
              type="button"
              onClick={onClose}
              className="focus-ring rounded border border-tile text-ink2 font-medium text-sm px-5 py-2.5 hover:text-amber hover:border-amber/40 transition-colors duration-200"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

function RingingScreen({ alarm, onResolve }) {
  const rounds = 2;
  const [round, setRound] = useState(1);
  const [challenge, setChallenge] = useState(() => generateChallenge(alarm.challengeType));
  const [answer, setAnswer] = useState('');
  const [feedback, setFeedback] = useState(null);
  const [confirmingGiveUp, setConfirmingGiveUp] = useState(false);

  const handleChange = (e) => {
    setAnswer(e.target.value);
    setFeedback(null);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!answer.trim()) {
      setFeedback({ type: 'error', text: 'Enter an answer first.' });
      return;
    }
    if (challenge.check(answer)) {
      if (round >= rounds) {
        onResolve('solved');
        return;
      }
      setFeedback({ type: 'success', text: 'Correct — next one.' });
      setRound((r) => r + 1);
      setChallenge(generateChallenge(alarm.challengeType));
      setAnswer('');
    } else {
      setFeedback({ type: 'error', text: 'Not quite — try again.' });
      setAnswer('');
    }
  };

  return (
    <div className="min-h-screen bg-board font-mono text-ink2 flex items-center justify-center p-6">
      <div className="w-full max-w-sm text-center">
        <div className="mx-auto w-16 h-16 rounded-full bg-risk/15 border-2 border-risk flex items-center justify-center text-risk animate-pulse">
          <Bell size={26} strokeWidth={1.8} />
        </div>
        <h1 className="font-display font-black text-3xl uppercase tracking-wide text-amber mt-6">Wake up</h1>
        <p className="text-ink3 text-sm mt-2">{alarm.label || 'Alarm'}</p>

        <div className="inline-flex items-center gap-2 border-2 border-risk rounded px-4 py-1.5 mt-4">
          <AlertTriangle size={14} className="text-risk" />
          <FlapRow text={`$${alarm.stake}`} size="sm" />
          <span className="text-risk text-xs uppercase tracking-wide">at stake</span>
        </div>

        <p className="text-ink3 text-[11px] mt-8 uppercase tracking-[0.2em]">
          Round {round} of {rounds}
        </p>
        <p className="font-display font-bold text-xl mt-3 whitespace-pre-line text-ink2">{challenge.prompt}</p>

        <form onSubmit={handleSubmit} className="mt-5">
          <input
            type="text"
            value={answer}
            onChange={handleChange}
            autoFocus
            className="w-full rounded bg-tile border-2 border-tile px-4 py-2.5 text-center text-amber font-mono focus:outline-none focus:border-amber transition-colors duration-200"
            placeholder="Your answer"
          />
          {feedback && (
            <p
              className={`text-xs mt-2 uppercase tracking-wide ${
                feedback.type === 'success' ? 'text-win' : 'text-risk'
              }`}
            >
              {feedback.text}
            </p>
          )}
          <button
            type="submit"
            className="focus-ring w-full rounded bg-amber text-board font-display font-black uppercase tracking-wide text-sm py-2.5 mt-4 hover:bg-amber/90 hover:scale-105 transition-all duration-200"
          >
            Submit
          </button>
        </form>

        <div className="mt-6">
          {confirmingGiveUp ? (
            <div className="flex items-center justify-center gap-3">
              <button
                type="button"
                onClick={() => onResolve('gave_up')}
                className="focus-ring rounded bg-risk text-board text-xs font-bold uppercase px-4 py-2 hover:scale-105 transition-all duration-200"
              >
                Confirm — lose ${alarm.stake}
              </button>
              <button
                type="button"
                onClick={() => setConfirmingGiveUp(false)}
                className="focus-ring text-ink3 text-xs hover:text-ink2 transition-colors duration-200"
              >
                Cancel
              </button>
            </div>
          ) : (
            <button
              type="button"
              onClick={() => setConfirmingGiveUp(true)}
              className="focus-ring text-risk/80 text-xs uppercase tracking-wide hover:text-risk transition-colors duration-200"
            >
              Give up (lose stake)
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [balance, setBalance] = useState(482.5);
  const [alarms, setAlarms] = useState([
    { id: 1, time: '06:30', label: 'Gym before work', stake: 15, days: [0, 1, 2, 3, 4], enabled: true },
    { id: 2, time: '08:00', label: 'Sunday long run', stake: 10, days: [6], enabled: true },
    { id: 3, time: '05:45', label: 'Flight to Denver', stake: 25, days: [], enabled: false }
  ]);

  const toggleAlarm = (id) =>
    setAlarms((prev) => prev.map((a) => (a.id === id ? { ...a, enabled: !a.enabled } : a)));

  const deleteAlarm = (id) => setAlarms((prev) => prev.filter((a) => a.id !== id));

  const [modalOpen, setModalOpen] = useState(false);
  const [editingAlarm, setEditingAlarm] = useState(null);

  const openAddModal = () => {
    setEditingAlarm(null);
    setModalOpen(true);
  };
  const openEditModal = (alarm) => {
    setEditingAlarm(alarm);
    setModalOpen(true);
  };
  const closeModal = () => setModalOpen(false);
  const saveAlarm = (alarm) => {
    setAlarms((prev) => {
      const exists = prev.some((a) => a.id === alarm.id);
      return exists ? prev.map((a) => (a.id === alarm.id ? alarm : a)) : [...prev, alarm];
    });
    setModalOpen(false);
  };

  const activeCount = alarms.filter((a) => a.enabled).length;
  const totalStaked = alarms.filter((a) => a.enabled).reduce((sum, a) => sum + a.stake, 0);

  const stats = [
    { label: 'Active', value: String(activeCount), Icon: Clock },
    { label: 'Staked', value: `$${totalStaked}`, Icon: Wallet },
    { label: 'Win rate', value: '86%', Icon: TrendingUp }
  ];

  const [ringingAlarm, setRingingAlarm] = useState(null);
  const resolveRing = (result) => {
    if (result === 'gave_up' && ringingAlarm) {
      setBalance((b) => b - ringingAlarm.stake);
    }
    setRingingAlarm(null);
  };

  if (ringingAlarm) {
    return <RingingScreen alarm={ringingAlarm} onResolve={resolveRing} />;
  }

  return (
    <div className="min-h-screen bg-board font-mono text-ink2">
      <header className="border-b-2 border-amber/25">
        <div className="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded bg-tile border border-amber/30 flex items-center justify-center text-amber">
              <Bell size={16} strokeWidth={2} />
            </div>
            <span className="font-display font-black text-lg tracking-wide text-amber uppercase">
              Stake Alarm
            </span>
          </div>
          <div className="flex items-center gap-4">
            <div className="hidden sm:block text-right">
              <p className="text-[10px] text-ink3 uppercase tracking-widest mb-1">Balance</p>
              <FlapRow text={`$${balance.toFixed(2)}`} size="sm" />
            </div>
            <button
              type="button"
              aria-label="Settings"
              className="focus-ring w-9 h-9 rounded border border-tile flex items-center justify-center text-ink3 hover:text-amber hover:border-amber/40 transition-colors duration-200"
            >
              <Settings size={17} />
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-6 py-10">
        <div className="border-2 border-tile rounded-lg p-7">
          <p className="text-[11px] text-ink3 uppercase tracking-widest mb-4">Available to stake</p>
          <FlapRow text={`$${balance.toFixed(2)}`} size="lg" />
          <div className="flex flex-wrap items-center gap-4 mt-6">
            <button
              type="button"
              onClick={() => setBalance((b) => b + 50)}
              className="focus-ring rounded bg-amber text-board font-display font-black text-sm uppercase tracking-wide px-5 py-2.5 hover:bg-amber/90 hover:scale-105 transition-all duration-200"
            >
              Deposit funds
            </button>
            <span className="text-ink3 text-xs">Virtual balance — no real money moves</span>
          </div>
        </div>

        <div className="grid grid-cols-3 gap-3 mt-4">
          {stats.map(({ label, value, Icon: StatIcon }) => (
            <div key={label} className="border border-tile rounded-lg px-4 py-3.5">
              <div className="flex items-center gap-1.5 text-ink3 mb-2">
                <StatIcon size={13} />
                <span className="text-[10px] uppercase tracking-widest">{label}</span>
              </div>
              <p className="font-display font-black text-2xl text-amber tabular">{value}</p>
            </div>
          ))}
        </div>

        <div className="mt-10">
          <div className="flex items-center justify-between border-b-2 border-amber/25 pb-3">
            <h2 className="font-display font-black text-sm tracking-[0.2em] text-ink2 uppercase">
              Alarms · Manifest
            </h2>
            <button
              type="button"
              onClick={openAddModal}
              className="focus-ring flex items-center gap-1.5 rounded bg-amber/15 border border-amber/40 text-amber text-xs font-mono font-semibold uppercase tracking-wide px-3.5 py-1.5 hover:bg-amber/25 hover:scale-105 transition-all duration-200"
            >
              <Plus size={13} strokeWidth={2.2} />
              Add alarm
            </button>
          </div>
          {alarms.length === 0 ? (
            <p className="text-ink3 text-sm mt-6">No alarms yet — add your first one.</p>
          ) : (
            <div>
              {alarms.map((alarm, i) => (
                <AlarmRow
                  key={alarm.id}
                  alarm={alarm}
                  style={{ animationDelay: `${i * 60}ms` }}
                  onToggle={toggleAlarm}
                  onDelete={deleteAlarm}
                  onEdit={() => openEditModal(alarm)}
                  onRing={() => setRingingAlarm(alarm)}
                />
              ))}
            </div>
          )}
        </div>
      </main>

      {modalOpen && <AlarmModal existing={editingAlarm} onClose={closeModal} onSave={saveAlarm} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
